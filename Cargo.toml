cargo-features = ["profile-rustflags"]

[package]
    name = "dma-tools-rs"
    version = "3.2.5"
    edition = "2024"

    authors = ["Shifty <contact@shifty.cloud>"]
    repository = "https://github.com/sh1ftd/dma-tools-rs"
    license = "AGPL-3.0"

[lints.rust]
    # Security
    non_ascii_idents = "forbid"

    # Deny old style Rust
    rust_2018_idioms = { level = "deny", priority = -1 }
    macro_use_extern_crate = "deny"
    absolute_paths_not_starting_with_crate = "deny"

    # Easy to read style and opinionated best practices
    explicit_outlives_requirements = "warn"
    missing_abi = "deny"
    unused_lifetimes = "warn"
    unused_macro_rules = "warn"
    single_use_lifetimes = "warn"


[lints.clippy]
    unused_async = "deny"
    undocumented_unsafe_blocks = "warn"
    implicit_clone = "warn"

[features]
    # cargo build --release --features branding
    branding = ["dep:image"]

[dependencies]
    eframe = { version = "0.36.0", features = ["wgpu"] }
    usvg = "0.48.1"
    resvg = "0.48.1"
    image = { version = "0.25", default-features = false, features = ["webp"], optional = true }
    arabic_reshaper = "0.4"
    unicode-bidi = "0.3"
    egui-phosphor = "0.13.0"

[target.'cfg(windows)'.dependencies]
    winapi = { version = "0.3", features = [
        "winuser",
        "minwindef",
        "windef",
        "processthreadsapi",
        "handleapi",
        "jobapi2",
        "tlhelp32",
        "winnt",
        "dwmapi",
        "utilapiset",
    ] }

[profile.dev]
    overflow-checks = true
    debug = true
    strip = false
    panic = "unwind"
    codegen-units = 256
    incremental = true
    opt-level = 0
    lto = false

[profile.release]
    overflow-checks = true
    debug = false
    strip = "symbols"
    panic = "abort"
    codegen-units = 1
    incremental = false
    opt-level = 3
    lto = "fat"
    rustflags = ["-C", "target-cpu=x86-64", "-C", "strip=symbols"]

[profile.release.package."*"]
    overflow-checks = true
    debug = false
    codegen-units = 1
    opt-level = 3
